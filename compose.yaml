# Deployment stack for Dokploy (Docker Compose application type).
#
# It runs the pre-built image published by .github/workflows/docker-publish.yml
# (on a v*.*.* tag push) rather than building on the server. Point a domain at
# the `app` service on port 8080.
#
# CONFIGURATION LIVES IN DOKPLOY, NOT HERE. Everything the application reads
# comes from the Environment Settings tab: Dokploy writes that tab to a `.env`
# file beside this compose file, which is both interpolated into `${...}` below
# and handed to the containers wholesale via `env_file`. Nothing is defaulted
# here, so what you see in that tab is exactly what the app runs with.
# Start from .env.docker.example — it lists every variable, including the two
# (DB_HOST, REDIS_HOST) that must match the service names below.
#
# For building and running locally instead, see compose.local.yaml.

x-app-image: &app-image ${APP_IMAGE}

# `:latest` is a mutable tag, so a redeploy would otherwise reuse the copy
# already cached on the host and silently ship the previous build.
x-pull: &pull always

# The full Environment tab, verbatim. app, worker and scheduler are the same
# image with different commands, so they must agree on every setting.
x-app-env: &app-env
  - .env

x-datastores: &datastores
  mariadb:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  app:
    image: *app-image
    pull_policy: *pull
    restart: unless-stopped
    env_file: *app-env
    environment:
      CONTAINER_ROLE: app
    volumes:
      # settings.json (anlutro/l4-settings) and uploaded files live here.
      - app-storage:/app/storage
    expose:
      - "8080"
    depends_on: *datastores

  # Processes queued work (Telegraph bot dispatches, notifications).
  worker:
    image: *app-image
    pull_policy: *pull
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    env_file: *app-env
    environment:
      CONTAINER_ROLE: worker
    volumes:
      - app-storage:/app/storage
    depends_on: *datastores

  # Runs the Laravel scheduler (currently: nightly telescope:prune).
  scheduler:
    image: *app-image
    pull_policy: *pull
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: *app-env
    environment:
      CONTAINER_ROLE: scheduler
    volumes:
      - app-storage:/app/storage
    depends_on: *datastores

  # The MARIADB_* names are what this image reads; they are mapped from the
  # DB_* variables the application uses so the tab has one name per setting.
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?required}
      MARIADB_USER: ${DB_USERNAME:?required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # Ships with the image and needs no credentials, unlike a mysqladmin ping.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-storage:
  mariadb-data:
  redis-data:
