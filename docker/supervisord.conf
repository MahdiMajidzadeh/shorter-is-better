; Process model for the single production container: supervisord is PID 1 and
; runs the web server plus the queue worker. The container healthcheck probes
; only the web server, so a crash-looping worker can hide behind a green tick —
; autorestart below brings a dead worker back, and worker liveness is checked
; with `docker exec <container> supervisorctl status` (see DOCKER.md).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; supervisorctl needs these two blocks — they are what makes
; `docker exec <c> supervisorctl status` work for checking worker liveness.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Processes queued work (Telegraph bot dispatches, notifications). numprocs>1
; would replace multiple worker containers; process_name keeps the log lines
; distinguishable.
[program:worker]
command=php artisan queue:work --tries=3 --max-time=3600 --sleep=3
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autorestart=true
; SIGTERM lets queue:work finish the current job — size this to the app's
; longest job timeout (Telegraph sends are short HTTP calls, so 90s is ample),
; and raise the Dokploy container stop timeout to match, or docker SIGKILLs
; supervisord after ~10s and the job dies mid-flight.
stopwaitsecs=90
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; No [program:scheduler]: App\Console\Kernel::schedule() is empty (has been
; since Telescope was removed). DOCKER.md carries the ready-to-paste block for
; when a scheduled task is added.
