; Production PHP settings for the container image.
; Loaded last so it overrides php.ini-production.

[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 32M
post_max_size = 32M

; Laravel writes its own log; let PHP errors reach stderr for `docker logs`.
display_errors = Off
log_errors = On
error_log = /dev/stderr

[Date]
; Laravel sets the app timezone (Asia/Tehran) itself; keep PHP on UTC.
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable, so never stat files looking for changes.
opcache.validate_timestamps = 0
