# LOCAL DEVELOPMENT ONLY — production runs as a single Dokploy Application
# (one container from the published image, no compose file; see DOCKER.md).
# This is the only place a database container and a local env file are allowed.
#
#   cat > .env.docker <<'EOF'          # .env.docker is gitignored
#   APP_KEY=        # php artisan key:generate --show
#   DB_PASSWORD=secret
#   DB_ROOT_PASSWORD=secret
#   EOF
#   docker compose -f compose.local.yaml --env-file .env.docker up --build
#
# The app container runs supervisord exactly like production: web server and
# queue worker in the one container, so what you exercise locally is the same
# process model that ships.

services:
  app:
    build:
      context: .
      target: runtime
    image: shorter-is-better:local
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Shorter}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?required - generate with `php artisan key:generate --show`}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-shorter}
      DB_USERNAME: ${DB_USERNAME:-shorter}
      DB_PASSWORD: ${DB_PASSWORD:?required}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      # No TLS in front of the container locally.
      SESSION_SECURE_COOKIE: "false"
    volumes:
      - app-storage:/app/storage
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-shorter}
      MARIADB_USER: ${DB_USERNAME:-shorter}
      MARIADB_PASSWORD: ${DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # Ships with the image and needs no credentials, unlike a mysqladmin ping.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-storage:
  mariadb-data:
