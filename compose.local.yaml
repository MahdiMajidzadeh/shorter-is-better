# Local stack: builds the image from source instead of pulling it, and
# publishes the app on http://localhost:8080.
#
#   cp .env.docker.example .env.docker
#   # fill in APP_KEY / DB_PASSWORD / DB_ROOT_PASSWORD
#   docker compose -f compose.local.yaml --env-file .env.docker up --build

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Shorter}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?required - generate with `php artisan key:generate --show`}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-debug}

  DB_CONNECTION: mariadb
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-shorter}
  DB_USERNAME: ${DB_USERNAME:-shorter}
  DB_PASSWORD: ${DB_PASSWORD:?required}

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"

  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  # No TLS in front of the container locally.
  SESSION_SECURE_COOKIE: "false"

x-datastores: &datastores
  mariadb:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  app:
    build:
      context: .
      target: runtime
    image: shorter-is-better:local
    restart: unless-stopped
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    volumes:
      - app-storage:/app/storage
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on: *datastores

  worker:
    image: shorter-is-better:local
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    volumes:
      - app-storage:/app/storage
    depends_on:
      app:
        condition: service_started

  scheduler:
    image: shorter-is-better:local
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    volumes:
      - app-storage:/app/storage
    depends_on:
      app:
        condition: service_started

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-shorter}
      MARIADB_USER: ${DB_USERNAME:-shorter}
      MARIADB_PASSWORD: ${DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # Ships with the image and needs no credentials, unlike a mysqladmin ping.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app-storage:
  mariadb-data:
  redis-data:
